plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'thaumicenergistics'
version = project.mod_version
base { archivesName = 'thaumicenergistics-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.verificationImplementation.extendsFrom configurations.implementation
configurations.verificationCompileOnly.extendsFrom configurations.compileOnly
configurations.verificationRuntimeOnly.extendsFrom configurations.runtimeOnly
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.verification
    addModdingDependenciesTo sourceSets.test
    mods {
        thaumicenergistics {
            sourceSet sourceSets.main
            sourceSet sourceSets.verification
        }
    }
    runs {
        client {
            client(); sourceSet = sourceSets.verification; gameDirectory = file('runs/client')
            programArguments.addAll('--mixin','thaumicenergistics-smoke.mixins.json')
        }
        clientSmoke {
            client()
            sourceSet = sourceSets.verification
            gameDirectory = file('runs/client')
            systemProperty 'thaumicenergistics.clientSmoke', 'true'
            // This host permits IPv4 localhost but rejects ::1; JDK's NIO selector
            // wakeup pipe otherwise fails before integrated-server login.
            systemProperty 'java.net.preferIPv4Stack', 'true'
            programArguments.addAll('--mixin','thaumicenergistics-smoke.mixins.json')
            programArguments.addAll('--quickPlaySingleplayer', 'THE-client-menu-smoke', '--width', '1280', '--height', '720')
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.verification
            gameDirectory = file('runs/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'thaumicenergistics'
            systemProperty 'thaumicenergistics.testReport', file('build/test-results/gametest.xml').absolutePath
        }
    }
}
def apiJar = file(providers.gradleProperty('thaumcraftApiJar')
        .getOrElse("../../../repo/api/build/libs/thaumcraft-api-${project.thaumcraft_version}.jar"))
def coreJar = file(providers.gradleProperty('thaumcraftRuntimeJar')
        .getOrElse("../../../repo/mod/build/libs/thaumcraft-1.21.1-${project.thaumcraft_version}.jar"))
def aopUiJar = file(providers.gradleProperty('aopUiJar')
        .getOrElse('../../../aopui/build/libs/aopui-1.21.1-0.7.0.jar'))
dependencies {
    compileOnly files(apiJar)
    compileOnly 'cc.tweaked:cc-tweaked-1.21.1-forge-api:1.113.0'
    compileOnly 'cc.tweaked:cc-tweaked-1.21.1-core-api:1.113.0'
    implementation "org.appliedenergistics:appliedenergistics2:${project.ae2_version}"
    runtimeOnly files(coreJar)
    runtimeOnly files(aopUiJar)
    runtimeOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.squiddev.cc' }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.theillusivec4.top/' } }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
}
tasks.register('verifyThaumcraftApi') {
    inputs.file(apiJar)
    doLast { if (!apiJar.isFile()) throw new GradleException("Missing public Thaumcraft API: ${apiJar}") }
}
tasks.named('compileJava') { dependsOn 'verifyThaumcraftApi' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.withType(Jar).configureEach { from('LICENSE'); from('NOTICE.md') }
tasks.named('processResources') {
    def legacyResearchOutput = file('build/resources/main/assets/thaumicenergistics/textures/research/Research.Background.png')
    doFirst {
        // Windows Copy can otherwise keep the old case-only output spelling.
        if (legacyResearchOutput.isFile() && !legacyResearchOutput.delete()) throw new GradleException('Cannot clear old research-texture output')
    }
    inputs.property('mod_version', project.version)
    def values = [mod_version: project.version]
    filesMatching('META-INF/neoforge.mods.toml') { expand(values) }
}
tasks.named('test') { enabled = false }
tasks.register('storageRulesTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'thaumicenergistics.storage.StorageRulesTest'
}
tasks.named('check') { dependsOn 'storageRulesTest', 'verificationClasses' }
tasks.register('conversionClickRulesTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'thaumicenergistics.parts.ConversionClickTrackerTest'
}
tasks.named('check') { dependsOn 'conversionClickRulesTest' }

tasks.register('prepareQuietClient') {
    def earlyConfig = file('runs/client/config/fml.toml')
    def options = file('runs/client/options.txt')
    doLast {
        earlyConfig.parentFile.mkdirs()
        def configText = earlyConfig.isFile() ? earlyConfig.getText('UTF-8') : ''
        // Disable the separate FML splash before any GLFW window can be created.
        configText = configText.replaceAll('(?m)^earlyWindowControl\\s*=.*$', 'earlyWindowControl = false')
        if (!(configText =~ /(?m)^earlyWindowControl\s*=/).find()) configText += '\nearlyWindowControl = false\n'
        earlyConfig.setText(configText,'UTF-8')
        def optionText = options.isFile() ? options.getText('UTF-8') : ''
        [soundCategory_master:'0.0', pauseOnLostFocus:'false', fullscreen:'false', maxFps:'30'].each { name,value ->
            def line = "${name}:${value}"
            if ((optionText =~ "(?m)^${name}:").find()) optionText = optionText.replaceAll("(?m)^${name}:.*\$",line)
            else optionText += "\n${line}\n"
        }
        options.setText(optionText,'UTF-8')
    }
}
tasks.named('runClient') { dependsOn 'prepareQuietClient' }
tasks.named('runClientSmoke') { dependsOn 'prepareQuietClient' }

tasks.named('runGameTestServer') {
    dependsOn 'jar'
    def report = file('build/test-results/gametest.xml')
    def provenance = file('build/test-results/native-inputs.json')
    def nativeInputs = [artifact: file("build/libs/thaumicenergistics-1.21.1-${project.mod_version}.jar"), core: coreJar, api: apiJar, aop_ui: aopUiJar]
    doFirst {
        if (report.exists() && !report.delete()) throw new GradleException('Cannot clear previous test report')
        def inputs = nativeInputs.collectEntries { name, path ->
            [(name): [path: path.absolutePath, sha256: java.security.MessageDigest.getInstance('SHA-256').digest(path.bytes).encodeHex().toString()]]
        }
        provenance.parentFile.mkdirs()
        provenance.text = new groovy.json.JsonBuilder([inputs: inputs, completed: false]).toPrettyString()
    }
    doLast {
        if (!report.isFile()) throw new GradleException('No fresh GameTest XML: inspect the server startup log')
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        def result = factory.newDocumentBuilder().parse(report)
        int count = result.getElementsByTagName('testcase').length
        if (count == 0 || result.getElementsByTagName('failure').length > 0 || result.getElementsByTagName('error').length > 0) {
            throw new GradleException("GameTests failed or empty: ${report}")
        }
        def evidence = new groovy.json.JsonSlurper().parse(provenance)
        nativeInputs.each { name, path ->
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(path.bytes).encodeHex().toString()
            if (actual != evidence.inputs[name].sha256) throw new GradleException("Native input changed during GameTests: ${name}; rerun against the rebuilt dependency")
        }
        evidence.completed = true
        evidence.report_sha256 = java.security.MessageDigest.getInstance('SHA-256').digest(report.bytes).encodeHex().toString()
        provenance.text = new groovy.json.JsonBuilder(evidence).toPrettyString()
        logger.lifecycle("THE_FRESH_GAMETEST_REPORT_PASS tests=${count}")
    }
}

tasks.named('runClientSmoke') {
    dependsOn 'jar'
    def result = file('runs/client/thaumicenergistics-smoke/result.json')
    def provenance = file('build/test-results/client-smoke-inputs.json')
    def smokeSave = file('runs/client/saves/THE-client-menu-smoke')
    def ownershipMarker = new File(smokeSave,'.thaumicenergistics-smoke-owned')
    def testLevel = file('runs/gametest/world/level.dat')
    def clientInputs = [artifact: file("build/libs/thaumicenergistics-1.21.1-${project.mod_version}.jar"), core: coreJar, api: apiJar, aop_ui: aopUiJar]
    doFirst {
        // Refuse an unmarked save before Minecraft can open or autosave it.
        if (smokeSave.exists() && !ownershipMarker.isFile()) throw new GradleException("Refusing unmarked client save: ${smokeSave}")
        if (!smokeSave.exists()) {
            if (!testLevel.isFile()) throw new GradleException('Run GameTests first to create the isolated level template')
            if (!smokeSave.mkdirs()) throw new GradleException('Cannot create isolated client save')
            java.nio.file.Files.copy(testLevel.toPath(),new File(smokeSave,'level.dat').toPath())
            ownershipMarker.text = 'Thaumic Energistics isolated verification save; no user chunks/playerdata copied.\n'
        }
        if (result.exists() && !result.delete()) throw new GradleException('Cannot clear previous client-smoke result')
        def inputs = clientInputs.collectEntries { name, path ->
            [(name): [path: path.absolutePath, sha256: java.security.MessageDigest.getInstance('SHA-256').digest(path.bytes).encodeHex().toString()]]
        }
        provenance.parentFile.mkdirs()
        provenance.text = new groovy.json.JsonBuilder([inputs: inputs, completed: false]).toPrettyString()
    }
    doLast {
        if (!result.isFile()) throw new GradleException('Client smoke produced no result')
        def outcome = new groovy.json.JsonSlurper().parse(result)
        def requiredChecks = ['server_cursor_filter_packet','storage_filter_retained_after_inverter','inverter_tool_and_void_packets','absolute_priority_real_payload',
                'backspace_at_typing_limit','io_capacity_card_packet','workbench_real_cell_and_partition_packets','vis_drain_color_real_client_sync',
                'hidden_unfocused_window','sound_playback_blocked','aspect_palette_rendered','linked_research_real_client_sync','imported_research_real_client_sync',
                'emitter_menu_real_packets','emitter_world_flare_synced',
                'monitor_face_down','monitor_face_up','monitor_face_north','monitor_face_south','monitor_face_west','monitor_face_east',
                'conversion_fill_real_packet','conversion_batch_real_packets','conversion_partial_phial_refused',
                'terminal_menu_real_packets','terminal_work_slots','terminal_cursor_transfer','terminal_native_craft_menu','terminal_search_filter','terminal_real_wrench_restore',
                'cell_chest_native_configuration','cell_terminal_local_real_packets','cell_terminal_work_transfer','cell_terminal_close_conserves_work_items','cell_terminal_modes_reopen','cell_terminal_replacement_closes_menu',
                'wireless_native_ap_binding_packet','wireless_initial_connection_real_packet','wireless_bound_slot_real_packets','wireless_work_and_battery_real_packets','wireless_modes_reopen','wireless_native_craft_return','wireless_range_closes_menu','monitoring_research_pages_real_sync']
        if (outcome.automation_passed != true || outcome.screenshots.size() < 46
                || requiredChecks.any { outcome[it] != true }
                || outcome.screenshots.any { !new File(it).isFile() || new File(it).length() < 100 }) {
            throw new GradleException("Client automation failed or screenshots missing: ${result}")
        }
        def evidence = new groovy.json.JsonSlurper().parse(provenance)
        clientInputs.each { name, path ->
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(path.bytes).encodeHex().toString()
            if (actual != evidence.inputs[name].sha256) throw new GradleException("Client input changed during verification: ${name}")
        }
        evidence.completed = true
        evidence.result_sha256 = java.security.MessageDigest.getInstance('SHA-256').digest(result.bytes).encodeHex().toString()
        provenance.text = new groovy.json.JsonBuilder(evidence).toPrettyString()
        logger.lifecycle("THE_FRESH_CLIENT_SMOKE_PASS screenshots=${outcome.screenshots.size()}; visual review still required")
    }
}
